<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>LeadyIA — Automação de Leads com IA</title>

    <!-- FONT -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <!-- CSP AJUSTADA -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        script-src 'self' https://widget.leadyia.com https://api.leadyia.com 'unsafe-inline';
        connect-src 'self' https://api.leadyia.com https://dashboard.leadyia.com https://widget.leadyia.com;
        img-src 'self' data: https://widget.leadyia.com;
        style-src 'self' https://fonts.googleapis.com https://widget.leadyia.com 'unsafe-inline';
        font-src https://fonts.gstatic.com;
        frame-src https://dashboard.leadyia.com;
      "
    />
  </head>

  <body>
    <div id="root"></div>

    <!-- React App -->
    <script type="module" src="/src/main.jsx"></script>

    <!-- ===================================================== -->
    <!-- LEADYIA WIDGET -->
    <!-- ===================================================== -->

    <script>
  (function () {
    var script = document.createElement("script");
    script.src = "https://widget.leadyia.com/v1/widget.js";
    script.async = true;

    script.onload = function () {
      if (window.__LEADYIA_INIT__) {
        window.__LEADYIA_INIT__("init", {
          clientId: "6969b5053077dca7a1a214b1",
          theme: "dark"
        });
      } else {
        console.error("LeadyIA: init não encontrado.");
      }
    };

    document.head.appendChild(script);
  })();
</script>
  </body>
</html>
